services:
  wayfarer:
    build: .
    image: wayfarer:local
    container_name: wayfarer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      WAYFARER_AUTH_TOKEN: ${WAYFARER_AUTH_TOKEN:?Set WAYFARER_AUTH_TOKEN in .env (16 or more characters)}
      WAYFARER_LOCATIONS: ${WAYFARER_LOCATIONS:-}
      WAYFARER_ALLOWED_HOSTS: ${WAYFARER_ALLOWED_HOSTS:-localhost,127.0.0.1}
      WAYFARER_MAX_SEGMENTS: ${WAYFARER_MAX_SEGMENTS:-8}
      WAYFARER_MAX_CONCURRENT_DOWNLOADS: ${WAYFARER_MAX_CONCURRENT_DOWNLOADS:-3}
      WAYFARER_BANDWIDTH_LIMIT: ${WAYFARER_BANDWIDTH_LIMIT:-0}
    volumes:
      - wayfarer-data:/data
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  wayfarer-data:
