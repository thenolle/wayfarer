name: Quality checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: Installer scripts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in 'install.ps1', 'uninstall.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("deployment/install/$file", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Out-Host; exit 1 }
          }
      - name: Check the shell scripts
        shell: bash
        run: |
          bash -n deployment/install/install.sh
          bash -n deployment/install/uninstall.sh

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check licences
        run: bun run licenses
      - name: Run quality checks
        run: bun run check

  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run quality checks
        run: bun run check

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag wayfarer:ci .
      - name: Start the container and wait for it to be healthy
        run: |
          docker run --detach --name wayfarer-ci \
            --env WAYFARER_AUTH_TOKEN=ci-token-0123456789abcdef \
            --env WAYFARER_ALLOWED_HOSTS=localhost,127.0.0.1 \
            wayfarer:ci
          for attempt in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' wayfarer-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs wayfarer-ci
          exit 1
