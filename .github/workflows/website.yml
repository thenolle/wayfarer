name: Website

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Read the Pages settings
        id: pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Type-check and test
        working-directory: website
        run: |
          bun run typecheck
          bun test
      - name: Build the site
        working-directory: website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://thenolle.github.io/wayfarer/' }}
        run: bun run build
      - name: Check the output
        run: |
          for file in index.html 404.html sw.js sitemap.xml robots.txt manifest.webmanifest search-index.json; do
            test -s "website/dist/$file" || { echo "Missing website/dist/$file"; exit 1; }
          done
      - name: Upload the site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
