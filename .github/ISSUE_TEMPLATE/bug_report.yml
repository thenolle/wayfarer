name: Bug report
description: Report a problem with Wayfarer.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide enough information to reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Start Wayfarer.
        2. Add a download.
        3. Observe the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wayfarer version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional information
      description: Include relevant logs, error messages, or screenshots.
      render: text
    validations:
      required: false
